name: stackchain
description: >-
  Scaffold a Flutter app from a YAML config. Add features with one command,
  keep router and DI in sync, and migrate your stack safely.
version: 1.3.1
homepage: https://suhailthakrani.github.io/stackchain-docs/
repository: https://github.com/suhailthakrani/stackchain
issue_tracker: https://github.com/suhailthakrani/stackchain/issues
documentation: https://suhailthakrani.github.io/stackchain-docs/
screenshots:
  - description: Stackchain — Flutter scaffolding from a YAML config
    path: assets/stackchain_logo.png
topics:
  - flutter
  - generator
  - scaffold
  - architecture
  - bloc

environment:
  sdk: ^3.5.0

executables:
  stackchain: stackchain
  init: init

dependencies:
  ansicolor: ^2.0.3
  args: ^2.5.0
  collection: ^1.18.0
  path: ^1.9.0
  recase: ^4.1.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
