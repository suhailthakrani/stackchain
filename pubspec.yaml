name: stackchain
description: >-
  Config-driven Flutter scaffolding CLI. Set architecture, state management,
  routing, DI, and networking in stackchain.yaml, then generate features
  on demand.
version: 1.0.0
homepage: https://github.com/suhailthakrani/stackchain
repository: https://github.com/suhailthakrani/stackchain
issue_tracker: https://github.com/suhailthakrani/stackchain/issues
documentation: https://github.com/suhailthakrani/stackchain#readme
topics:
  - flutter
  - generator
  - scaffold
  - architecture
  - bloc

environment:
  sdk: ^3.5.0

executables:
  stackchain: stackchain
  init: init

dependencies:
  ansicolor: ^2.0.3
  args: ^2.5.0
  collection: ^1.18.0
  path: ^1.9.0
  recase: ^4.1.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
