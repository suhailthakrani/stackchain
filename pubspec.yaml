name: stackchain
description: >-
  Config-driven Flutter scaffolding that evolves with your app. Presets,
  vertical slices, smart merges, upgrade/migrate, and a quality gate on
  every generate.
version: 1.1.1
homepage: https://github.com/suhailthakrani/stackchain
repository: https://github.com/suhailthakrani/stackchain
issue_tracker: https://github.com/suhailthakrani/stackchain/issues
documentation: https://github.com/suhailthakrani/stackchain#readme
screenshots:
  - description: Stackchain — config-driven Flutter scaffolding
    path: assets/stackchain_logo.png
topics:
  - flutter
  - generator
  - scaffold
  - architecture
  - bloc

environment:
  sdk: ^3.5.0

executables:
  stackchain: stackchain
  init: init

dependencies:
  ansicolor: ^2.0.3
  args: ^2.5.0
  collection: ^1.18.0
  path: ^1.9.0
  recase: ^4.1.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
