name: stackchain
description: >-
  Flutter scaffolding from a simple config. Use presets, add full features,
  keep router and DI in sync, migrate safely, and run quality checks on
  every generate.
version: 1.1.3
homepage: https://suhailthakrani.github.io/stackchain-docs/
repository: https://github.com/suhailthakrani/stackchain
issue_tracker: https://github.com/suhailthakrani/stackchain/issues
documentation: https://suhailthakrani.github.io/stackchain-docs/
screenshots:
  - description: Stackchain — config-driven Flutter scaffolding
    path: assets/stackchain_logo.png
topics:
  - flutter
  - generator
  - scaffold
  - architecture
  - bloc

environment:
  sdk: ^3.5.0

executables:
  stackchain: stackchain
  init: init

dependencies:
  ansicolor: ^2.0.3
  args: ^2.5.0
  collection: ^1.18.0
  path: ^1.9.0
  recase: ^4.1.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
